packages:
  - "apps/*"
  - "packages/*"

# Security-pinned transitive deps (pnpm >=10 settings live here, not in
# package.json):
#  - ws: engine.io 6.6.8 caps it at the vulnerable ~8.20.1, and pnpm's
#    `update` refuses to bump the transitive engine.io to the version that
#    admits ws ~8.21.0, so we pin the patched ws directly.
#  - jsdom>undici: jsdom (via vitest, misdeclared as a prod dep by
#    better-auth / isomorphic-dompurify) pins undici 7.27.2; the advisory
#    fixes land in 7.29.1, which is inside jsdom's ^7.25.0 range. The scoped
#    override forces the in-range patched version (8.x would break jsdom:
#    it needs the removed undici/lib/handler/wrap-handler.js).
#  - fast-uri: ajv@8.18.0 (NestJS CLI tooling) pins 3.1.x, which trails a
#    string of advisories (authority injection, host confusion, case
#    normalization); 3.1.8 is the current patched 3.x (4.x is a forced
#    major we don't need).
#  - engine.io: socket.io@4.8.4 admits 6.6.8, below the DoS fix
#    (>=6.6.10); 6.6.10 stays in the ~6.6 range socket.io wants.
#  - multer, mysql2, and qs: framework/auth transitive ranges currently
#    resolve vulnerable releases; force the advisory's patched versions.
#  - js-yaml: keep each transitive consumer on its existing major while
#    applying the patched 3.x and 4.x releases. Swagger's 5.x is already safe.
#  - hono: shadcn's MCP tooling resolves a vulnerable patch release.
#  - socket.io-parser: socket.io@4.8.3 pins 4.2.6, below the memory-
#    exhaustion fix (>=4.2.7); 4.2.7 is in-range and patched.
#  - nanoid@3: postcss (via next/tailwind/vite) resolves 3.3.17, below the
#    GHSA fix (>=3.3.18); scoped to 3.x so a future nanoid 4/5 consumer is
#    untouched.
#  - deepmerge-ts: @prisma/config pins vulnerable 7.1.5 (GHSA stack-
#    exhaustion, fixed in 8.0.0); verified the Prisma CLI still runs with
#    8.0.2 before pinning.
#  - better-auth>next: better-auth pulls next 16.3.5 (<16.3.6 RCE fix) into
#    api/auth/db workspaces; force the web's 16.4.0 (dev-only there, never
#    imported by the API).
#  - proxy-addr: express (api) / MCP SDK (shadcn tooling) resolve 2.0.7,
#    below the IP-spoofing fix (>=2.0.8).
#  - handlebars: ts-jest (dev) pins 4.7.9, below the AST-injection fixes
#    (>=4.7.10).
#  - brace-expansion: pin each installed major to its patched release
#    (1.x→1.1.21, 2.x→2.1.7, 5.x→5.0.12); all dev-only via jest/shadcn.
#  - source-map-js: magicast (Prisma config loader) resolves 1.2.1, below
#    the fix (>=1.2.2); verified `prisma generate` still runs.
#  - sharp: better-auth>next resolves 0.35.4; force the 0.35.5 the web
#    already runs.
#  - @modelcontextprotocol/sdk: shadcn tooling resolves 1.30.0, below the
#    fix (>=1.31.0); dev CLI only.
#  - shadcn/@dotenvx undici: the jsdom-scoped pin doesn't cover undici
#    copies under the shadcn CLI tree (dev only); pin those parents too.
#    express-rate-limit/socks>ip-address, shadcn>postcss-selector-parser,
#    pino-pretty>fast-copy and iso-dompurify>dompurify are the same story:
#    dev/tooling-time transitives with patch-level fixes, except dompurify
#    (low, sanitizer — patch release, no API change).
overrides:
  ws: 8.21.2
  jsdom>undici: 7.29.1
  shadcn>undici: 7.29.1
  '@dotenvx/dotenvx>undici': 7.29.1
  '@shadcn/registry>undici': 7.29.1
  fast-uri: 3.1.8
  multer: 2.4.0
  mysql2: 3.23.1
  qs: 6.16.0
  js-yaml@3: 3.15.2
  js-yaml@4: 4.3.2
  hono: 4.13.7
  socket.io-parser: 4.2.7
  engine.io: 6.6.10
  '@nestjs/swagger>js-yaml': 5.4.1
  vite: 8.2.1
  nanoid@3: 3.3.18
  deepmerge-ts: 8.0.2
  better-auth>next: 16.4.0
  proxy-addr: 2.0.8
  handlebars: 4.7.10
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  source-map-js: 1.2.2
  sharp: 0.35.5
  '@modelcontextprotocol/sdk': 1.31.0
  ip-address: 10.7.1
  fast-copy: 4.1.0
  postcss-selector-parser: 7.1.6
  isomorphic-dompurify>dompurify: 3.4.16
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': true
  core-js-pure: true
  esbuild: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - deepmerge-ts@8.0.2
