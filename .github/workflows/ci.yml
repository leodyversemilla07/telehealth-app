name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # Real Postgres for the full-stack e2e step (db.e2e-spec.ts) — the API
    # suite boots the full AppModule against real Prisma queries.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telehealth
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d telehealth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          version: 11.4.0
          runtime: node@24
          install: false
          cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: Toolchain sanity
        run: pnpm --version && node --version

      - name: Cache Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: .turbo-${{ runner.os }}-${{ hashFiles('turbo.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            .turbo-${{ runner.os }}-

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      # Guard #1 against the repo's historical landmine: workspace/lockfile
      # drift (pnpm-workspace.yaml / package.json / pnpm-lock.yaml silently
      # reverting to HEAD locally). A frozen install + clean diff proves the
      # three manifest files agree on a fresh checkout.
      - name: Detect lockfile / workspace drift
        run: git diff --exit-code -- pnpm-lock.yaml pnpm-workspace.yaml package.json

      # Production-only vulnerability scan. Tolerant on purpose: the npm
      # audit endpoint npm deprecated is intermittently unavailable (410),
      # so every-PR hard-failing here would block non-code pushes. Dependabot
      # security alerts are the real blocking signal.
      - name: Audit (production, tolerant)
        continue-on-error: true
        run: pnpm audit --prod --audit-level high

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Coverage gate (API)
        working-directory: apps/api
        run: pnpm run test:cov --silent

      # Full-AppModule HTTP e2e (CRM-style supertest suites booting the real
      # module graph over the mocked PrismaClient).
      - name: API e2e (HTTP, full AppModule)
        working-directory: apps/api
        run: pnpm run test:e2e --silent

      # Full-stack e2e against the REAL Postgres service: migrate the schema
      # then boot the app and drive REST/service paths with live queries.
      - name: API e2e (real Postgres)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telehealth?schema=public
        run: |
          pnpm --filter @telehealth/db exec prisma migrate deploy
          pnpm run test:e2e:db --silent

      - name: Build
        run: pnpm build